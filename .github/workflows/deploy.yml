name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # The EDRDG licence for KANJIDIC2 requires web deployments to refresh the
  # dictionary data at least monthly; the rebuild below pulls the latest.
  schedule:
    - cron: '0 3 1 * *'
    - cron: '0 3 * * *'

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /tc-translate/
    permissions:
      contents: read
    outputs:
      artifact: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Always ship the latest mistlib engine and wrapper without changing
      # package files. Versions are read from the installed package.json files
      # rather than `npm ls`, which exits non-zero once latest no longer matches
      # the pins in package.json. The type-check in the build step gates
      # deployment: API breaks fail the build and the previous Pages deploy
      # stays live.
      - name: Install latest mistlib
        run: |
          # The wrapper declares the engine version it supports as a peer
          # dependency, so pair the latest wrapper with that engine instead of
          # engine@latest (which fails to resolve once the engine is ahead).
          peer=$(npm view @tik-choco/mistlib-web@latest 'peerDependencies.@tik-choco/mistlib')
          npm install --no-save @tik-choco/mistlib-web@latest "@tik-choco/mistlib@${peer:-latest}"
          node -e "for (const p of ['@tik-choco/mistlib', '@tik-choco/mistlib-web']) console.log(p, JSON.parse(require('fs').readFileSync('node_modules/' + p + '/package.json', 'utf8')).version)"

      # Falls back to the committed ja-readings.json if EDRDG is unreachable.
      - name: Refresh KANJIDIC2 readings
        run: node scripts/build-kanji-readings.mjs
        continue-on-error: true

      - name: Build
        run: npm run build

      # Unique artifact name per attempt: re-runs keep earlier attempts'
      # artifacts in the run, and deploy-pages fails when several share a name.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./dist

  # Deploy is its own job, as in GitHub's Pages starter workflows.
  # deploy-pages looks the artifact up through the Actions API, which can
  # report none for a few seconds after the upload; the wait step below
  # polls that same API so the deploy never starts before it is listed.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=$ARTIFACT" --jq .total_count || echo 0)
            [ "$n" -gt 0 ] && exit 0
            echo "Artifact $ARTIFACT not listed yet (try $i)"
            sleep 5
          done
          echo "::error::Artifact $ARTIFACT was not listed after 2 minutes"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
